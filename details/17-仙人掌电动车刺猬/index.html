gate"><div class="box"><div class="kicker">本草奇探 · 异常本草图鉴</div><h2>仙人掌电动车刺猬</h2><input id="pw" type="password" placeholder="输入访问密码"><button onclick="unlock()">进入详情</button><div class="err" id="err"></div></div></div><main><a class="back" href="../../index.html">← 返回异常本草图鉴</a><section class="hero"><div class="kicker">市井异化植物怪物 · 编号 17</div><h1>仙人掌电动车刺猬</h1><p>废车轮包满仙人掌肉质组织，胎面弹射硬刺</p></section><section class="asset"><h2>🎬 形态主视图</h2><div class="grid"><article class="card"><img src="../../第二套_17_仙人掌电动车刺猬.png" alt="仙人掌电动车刺猬 形态"><div class="info">仙人掌电动车刺猬<small>市井环境形态 · 第二套</small></div></article></div></section></main><script>const H='019be397cf10ba2e242d7507db0852b1dcab423c62bd150024ef1333a68136aa';async function sh(s){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('')}function unlock(){sh(document.getElementById('pw').value).then(x=>x===H?(sessionStorage.setItem('_pw_ok','1'),document.getElementById('gate').style.display='none'):document.getElementById('err').textContent='密码不正确')}if(sessionStorage.getItem('_pw_ok')==='1')document.getElementById('gate').style.display='none';document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});</script></body></html>
